# CKB Fiber Network node (FNN) — testnet. Third-party image; we only RUN it
# (no Rust, no forking). RPC + WebSocket on 8227; P2P on 8228.
#
#   FIBER_SECRET_KEY_PASSWORD=dev-password \
#     docker compose -f infra/docker-compose.fiber.yml up -d
#
# On first start the entrypoint copies the bundled TESTNET config to
# /fiber/config.yml (persisted in ./fiber/data) and encrypts the plaintext
# CKB key at ./fiber/data/ckb/key (create it first — see infra/README.md).
#
# WHY --rpc-listening-addr: FNN 0.9.x refuses to START if RPC binds an
# unspecified/public address without biscuit auth — `0.0.0.0:8227` exits with
# "Cannot listen on a public address without a biscuit public key set in the
# config" (crates/fiber-lib/src/rpc/mod.rs::is_public_addr). Its own default,
# 127.0.0.1:8227, is only reachable *inside* the container. An RFC1918 address
# is not "public" to that check, so we bind the container's own private IP:
# `hostname: fiber-node` makes Docker write `<private-ip> fiber-node` into
# /etc/hosts, and FNN resolves that name at startup. RPC is then reachable over
# ordinary Docker networking — no socat sidecar sharing the node's netns.
services:
  fiber:
    image: nervos/fiber:${FIBER_IMAGE_TAG:-0.9.0-rc7}
    container_name: fiber-node
    hostname: fiber-node # Docker maps this to the container's private IP in /etc/hosts
    command: ["--rpc-listening-addr", "fiber-node:8227"]
    environment:
      FIBER_SECRET_KEY_PASSWORD: ${FIBER_SECRET_KEY_PASSWORD:-dev-password}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8227:8227" # RPC/WS — loopback-only on the host, never public
      - "8228:8228" # P2P
    volumes:
      - ./fiber/data:/fiber
    restart: unless-stopped
